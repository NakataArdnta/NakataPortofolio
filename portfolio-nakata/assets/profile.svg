<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="36" fill="url(#bgGradient)" />

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Ambient Glow Behind Avatar -->
  <circle cx="200" cy="180" r="95" fill="url(#accentGrad)" opacity="0.25" filter="url(#glow)" />
  <circle cx="200" cy="180" r="90" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Avatar Figure -->
  <!-- Shoulders / Body -->
  <path d="M110 340 C110 275 145 250 200 250 C255 250 290 275 290 340 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M140 340 C140 280 165 260 200 260 C235 260 260 280 260 340 Z" fill="url(#accentGrad)" opacity="0.15" />

  <!-- Neck -->
  <rect x="184" y="215" width="32" height="45" rx="6" fill="#334155" />

  <!-- Head Base -->
  <circle cx="200" cy="170" r="54" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" />

  <!-- Modern Hair Geometric Silhouette -->
  <path d="M150 160 C150 115 175 105 200 105 C228 105 250 115 250 160 C242 140 225 130 200 130 C175 130 158 140 150 160 Z" fill="url(#accentGrad)" />

  <!-- Tech Glasses / Modern Visor Frame -->
  <rect x="168" y="156" width="28" height="18" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
  <rect x="204" y="156" width="28" height="18" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
  <line x1="196" y1="164" x2="204" y2="164" stroke="#60a5fa" stroke-width="2" />

  <!-- Eyes / Tech Glint -->
  <circle cx="182" cy="165" r="3" fill="#38bdf8" />
  <circle cx="218" cy="165" r="3" fill="#a78bfa" />

  <!-- Friendly Smile -->
  <path d="M190 195 Q200 203 210 195" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Minimal Decorative Code Badges -->
  <g transform="translate(42, 60)">
    <rect width="64" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9" />
    <text x="32" y="18" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">&lt;code&gt;</text>
  </g>

  <g transform="translate(295, 270)">
    <rect width="65" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9" />
    <text x="32" y="18" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">&#123; ideas &#125;</text>
  </g>

  <!-- Glowing Dot / Status Online -->
  <circle cx="265" cy="245" r="8" fill="#10b981" />
  <circle cx="265" cy="245" r="14" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="8;16;8" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
